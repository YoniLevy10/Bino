<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0066FF" />
  <title>Bino — אין חיבור</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f9f9fb;
      color: #1a1a2e;
      text-align: center;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      border-radius: 16px;
      background: #0066FF;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    h1 { font-size: 1.25rem; margin: 0 0 10px; }
    p { margin: 0 0 20px; color: #86868b; font-size: 0.95rem; line-height: 1.5; max-width: 300px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: #0066FF;
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 12px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true">B</div>
  <h1>אין חיבור לאינטרנט</h1>
  <p>פתח את האפליקציה פעם אחת כשיש רשת — ואז אפשר לחזור אליה גם במצב טיסה עם מה שנשמר במכשיר.</p>
  <button type="button" id="retry">נסה שוב</button>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      location.reload()
    })
    window.addEventListener('online', function () {
      location.reload()
    })
  </script>
</body>
</html>
